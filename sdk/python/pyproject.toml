[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arkvoid"
version = "1.0.0"
description = "Official Python SDK for ARKVOID – AI Agent Monitoring & Governance"
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [
    { name = "ARKVOID Inc.", email = "cherazen.ai@gmail.com" }
]
keywords = [
    "arkvoid", "ai", "agent", "monitoring", "governance",
    "observability", "tracing", "audit", "compliance",
    "llm", "openai", "langchain", "anthropic"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.8"
dependencies = []  # Zero required dependencies. Uses stdlib only.

[project.optional-dependencies]
requests = ["requests>=2.28.0"]
async   = ["aiohttp>=3.8.0"]
all     = ["requests>=2.28.0", "aiohttp>=3.8.0"]
openai  = ["openai>=1.0.0"]
dev     = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
]

[project.urls]
Homepage      = "https://arkvoid.cherazen.com"
Documentation = "https://github.com/arkvoidai/arkvoid/tree/main/sdk/python"
Repository    = "https://github.com/arkvoidai/arkvoid"
"Bug Tracker" = "https://github.com/arkvoidai/arkvoid/issues"

[tool.hatch.build.targets.wheel]
packages = ["arkvoid"]

[tool.hatch.build.targets.sdist]
include = [
    "arkvoid/**/*.py",
    "arkvoid/py.typed",
    "README.md",
    "../../LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.mypy]
python_version         = "3.8"
strict                 = true
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
